```yaml
name: Rust CI Build and Release

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust_target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        artifact_name:
          - nightwatche-rs-linux-amd64
          - nightwatche-rs-linux-arm64
        include:
          - rust_target: x86_64-unknown-linux-gnu
            artifact_name: nightwatche-rs-linux-amd64
          - rust_target: aarch64-unknown-linux-gnu
            artifact_name: nightwatche-rs-linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain for ${{ matrix.rust_target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev gcc-aarch64-linux-gnu
          # Install cross-compilation libraries for aarch64
          if [ "${{ matrix.rust_target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y libssl-dev:arm64
          fi

      - name: Set up cross-compilation environment for aarch64
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr/aarch64-linux-gnu" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rust_target }}

      - name: Run cargo build --release for ${{ matrix.rust_target }}
        run: cargo build --verbose --release --target ${{ matrix.rust_target }}

      - name: Calculate SHA256 sum for ${{ matrix.artifact_name }}
        id: sha256_calc
        run: |
          BINARY_PATH="target/${{ matrix.rust_target }}/release/nightwatche-rs"
          if [ -f "$BINARY_PATH" ]; then
            SHA=$(sha256sum "$BINARY_PATH" | awk '{print $1}')
            echo "$SHA ${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          else
            echo "Error: Binary not found at $BINARY_PATH"
            exit 1
          fi

      - name: Upload ${{ matrix.artifact_name }} binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.rust_target }}/release/nightwatche-rs

      - name: Upload SHA256 sum file for ${{ matrix.artifact_name }}
        uses: actions/upload-artifact@v4
        with:
          name: sha256-individual-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.sha256

  combine_checksums:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all individual SHA256 sum files
        uses: actions/download-artifact@v4
        with:
          pattern: sha256-individual-*
          path: downloaded_sha_files
          merge-multiple: true

      - name: Combine SHA256 sums into single 'prebuilt.sha256' file
        run: |
          echo "--- Combining SHA256 checksums ---"
          find downloaded_sha_files -type f -name "*.sha256" -exec cat {} + > prebuilt.sha256
          echo "Contents of prebuilt.sha256:"
          cat prebuilt.sha256
          mv prebuilt.sha256 .

      - name: Upload combined prebuilt.sha256 artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-checksums
          path: prebuilt.sha256

  upload-release:
    runs-on: ubuntu-latest
    needs: [build, combine_checksums]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nightwatche-rs-linux-*
          path: artifacts
          merge-multiple: true

      - name: Download combined SHA256 file
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-checksums
          path: artifacts

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          gh release upload $TAG_NAME \
            artifacts/nightwatche-rs-linux-amd64 \
            artifacts/nightwatche-rs-linux-arm64 \
            artifacts/prebuilt.sha256 \
            --repo ${{ github.repository }} --clobber