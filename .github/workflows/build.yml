name: Rust CI Build and Release

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain for x86_64
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu

      - name: Run cargo build --release
        run: cargo build --verbose --release --target x86_64-unknown-linux-gnu

      - name: Calculate SHA256 sum
        id: sha256_calc
        run: |
          BINARY_PATH="target/x86_64-unknown-linux-gnu/release/nightwatche-rs"
          if [ -f "$BINARY_PATH" ]; then
            SHA=$(sha256sum "$BINARY_PATH" | awk '{print $1}')
            echo "$SHA nightwatche-rs-linux-amd64" > "nightwatche-rs-linux-amd64.sha256"
          else
            echo "Error: Binary not found at $BINARY_PATH"
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightwatche-rs-linux-amd64
          path: target/x86_64-unknown-linux-gnu/release/nightwatche-rs

      - name: Upload SHA256 sum file
        uses: actions/upload-artifact@v4
        with:
          name: sha256-individual
          path: nightwatche-rs-linux-amd64.sha256

  combine_checksums:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download SHA256 sum file
        uses: actions/download-artifact@v4
        with:
          name: sha256-individual
          path: downloaded_sha_files

      - name: Create prebuilt.sha256 file
        run: |
          echo "--- Creating prebuilt.sha256 ---"
          mv downloaded_sha_files/nightwatche-rs-linux-amd64.sha256 prebuilt.sha256
          echo "Contents of prebuilt.sha256:"
          cat prebuilt.sha256

      - name: Upload prebuilt.sha256 artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-checksums
          path: prebuilt.sha256

  upload-release:
    runs-on: ubuntu-latest
    needs: [build, combine_checksums]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: nightwatche-rs-linux-amd64
          path: artifacts

      - name: Download combined SHA256 file
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-checksums
          path: artifacts

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          gh release upload $TAG_NAME \
            artifacts/nightwatche-rs-linux-amd64 \
            artifacts/prebuilt.sha256 \
            --repo ${{ github.repository }} --clobber
