[package]
name = "nightwatche-rs"
description = "Nightwatche, an auth log Telegram notifier."
version = "0.1.1"
authors = ["encrypt0r"]
repository = "https://github.com/its0din-ai/nightwatche-rs"
license = "MPL-2.0"
keywords = ["security", "alarm", "notify"]
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.4", features = ["macros"] }
async-trait = "0.1"
chrono = "0.4"
dotenv = "0.15"
futures = "0.3"
hostname = "0.4"
if-addrs = "0.13"
log = "0.4"
notify = "8.0"
pretty_env_logger = "0.5"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
teloxide = { version = "0.16", features = ["macros"] }
teloxide-core = "0.10"
tokio = { version = "1.40", features = ["full"] }
