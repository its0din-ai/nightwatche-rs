[package]
name = "nightwatche-rs"
description = "Nightwatche, an auth log Telegram notifier."
version = "0.1.1"
authors = ["encrypt0r"]
repository = "https://github.com/its0din-ai/nightwatche-rs"
license = "MPL-2.0"
keywords = ["security", "alarm", "notify"]
edition = "2024"

[dependencies]
chrono = "0.4.38"
regex = "1.11"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["full"] }
dotenv = "0.15"
teloxide = { version = "0.16", features = ["macros"] }
log = "0.4"
pretty_env_logger = "0.5"
hostname = "0.4"
if-addrs = "0.13"
notify = "8.0"
anyhow = "1.0.98"
