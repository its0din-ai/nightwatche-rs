[package]
name = "nightwatche-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.38"
regex = "1.11"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["full"] }
dotenv = "0.15"
teloxide = { version = "0.16", features = ["macros"] }
log = "0.4"
pretty_env_logger = "0.5"
hostname = "0.4"
if-addrs = "0.13"
notify = "8.0"
